name: Sync Canvas to Notion
on:
  schedule:
    - cron: "0 */3 * * *"  # cada 3 horas
  workflow_dispatch: {}     # botón para correrlo manualmente (también desde Notion vía api/trigger.py)

# El sync solo usa sus propios secrets; el GITHUB_TOKEN del job no necesita escribir.
permissions:
  contents: read

# Evita que un sync manual y uno programado escriban en Notion a la vez.
concurrency:
  group: canvas-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sync.py
        env:
          CANVAS_DOMAIN: ${{ secrets.CANVAS_DOMAIN }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ARCHIVE_OVERDUE_AFTER_DAYS: ${{ secrets.ARCHIVE_OVERDUE_AFTER_DAYS }}
          ANNOUNCEMENTS_LOOKBACK_DAYS: ${{ secrets.ANNOUNCEMENTS_LOOKBACK_DAYS }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          SYNC_STATUS_DATABASE_ID: ${{ vars.SYNC_STATUS_DATABASE_ID }}
      # sync.py reporta su propio final (éxito o error); esto solo cubre lo que
      # no alcanza a reportar: falla de pip o corrida cancelada. Solo usa stdlib.
      - name: Reportar falla en Notion
        if: failure() || cancelled()
        continue-on-error: true
        run: python sync_status.py fail "${{ job.status }}"
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_STATUS_DATABASE_ID: ${{ vars.SYNC_STATUS_DATABASE_ID }}
